<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Room Allocation System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-building"></i>
            Hotel Room Allocation System
        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="#">
                        <i class="bi bi-house"></i>
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#guestTable">
                        <i class="bi bi-people"></i>
                        Guests
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#statistics">
                        <i class="bi bi-bar-chart"></i>
                        Statistics
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<!-- ================= MAIN ================= -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-primary text-white text-center">

                    <h3>

                        <i class="bi bi-person-plus-fill"></i>

                        Add Guest Details

                    </h3>

                </div>

                <div class="card-body">

                    <!-- Alert -->

                    <div id="alertBox"></div>

                    <!-- Form -->

                    <form id="guestForm">

                        <div class="mb-3">

                            <label class="form-label">

                                Guest Name

                            </label>

                            <input
                                type="text"
                                id="guestName"
                                class="form-control"
                                placeholder="Enter Guest Name">

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Check-In

                                </label>

                                <input
                                    type="datetime-local"
                                    id="checkIn"
                                    class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Check-Out

                                </label>

                                <input
                                    type="datetime-local"
                                    id="checkOut"
                                    class="form-control">

                            </div>

                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-3">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                <i class="bi bi-door-open-fill"></i>

                                Allocate Room

                            </button>

                            <button
                                type="button"
                                id="resetBtn"
                                class="btn btn-danger">

                                <i class="bi bi-arrow-clockwise"></i>

                                Reset

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ================= STATISTICS ================= -->

<div class="container mt-5" id="statistics">

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card stat-card shadow">

                <div class="card-body text-center">

                    <i class="bi bi-people-fill display-4"></i>

                    <h5 class="mt-3">

                        Total Guests

                    </h5>

                    <h2 id="totalGuests">

                        0

                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card stat-card shadow">

                <div class="card-body text-center">

                    <i class="bi bi-building display-4"></i>

                    <h5 class="mt-3">

                        Rooms Used

                    </h5>

                    <h2 id="roomsUsed">

                        0

                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card stat-card shadow">

                <div class="card-body text-center">

                    <i class="bi bi-check-circle-fill display-4"></i>

                    <h5 class="mt-3">

                        Available Rooms

                    </h5>

                    <h2 id="availableRooms">

                        0

                    </h2>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ================= TABLE ================= -->

<div class="container mt-5" id="guestTable">

    <div class="card shadow-lg">

        <div class="card-header bg-dark text-white">

            <h4>

                <i class="bi bi-table"></i>

                Allocated Guests

            </h4>

        </div>

        <div class="card-body table-responsive">

            <table class="table table-striped table-hover align-middle">

                <thead class="table-primary">

                <tr>

                    <th>Guest Name</th>

                    <th>Check-In</th>

                    <th>Check-Out</th>

                    <th>Room</th>

                    <th>Status</th>

                </tr>

                </thead>

                <tbody id="guestTableBody">

                    <tr>

                        <td colspan="5" class="text-center text-muted">

                            No Guests Added Yet

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- ================= FOOTER ================= -->

<footer class="bg-primary text-white text-center p-3 mt-5">

    © 2026 Hotel Room Allocation System <br>

    Designed for DAA Hackathon

</footer>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->

<script src="script.js"></script>

</body>
</html>
